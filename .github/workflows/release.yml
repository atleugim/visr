name: release

on:
  push:
    tags: ["v*"]
  # A dry run from the Actions tab: builds and bundles everything, publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the older dry run, but a tag run is never cancelled mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            binary: visr
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: visr
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: visr.exe
            arch: x64
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            binary: visr.exe
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      # Installs the channel, components and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # A release must not ship a version that differs from the tag.
      - if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkgid="$(cargo pkgid -p visr)"
          [ "${pkgid##*[#@]}" = "$version" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml" >&2; exit 1; }
      - run: cargo build --release --locked -p visr
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ${{ matrix.target }}
          path: target/release/${{ matrix.binary }}
      # The installer wraps the executable built above. Only the Windows targets set an arch.
      - if: ${{ matrix.arch }}
        shell: bash
        run: ./scripts/licenses.sh target
      - if: ${{ matrix.arch }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # visr.iss needs Inno Setup 6.3 or later (x64compatible); the wrapper looks for version 6.
          choco install innosetup --version 6.7.1 --yes --no-progress
          # A dry run has no tag, so it takes the version from the workspace.
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = ((cargo pkgid -p visr) -split '[#@]')[-1]
          }
          ./scripts/windows/build-installer.ps1 -Version $version -Arch ${{ matrix.arch }}
      - if: ${{ matrix.arch }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: windows-setup-${{ matrix.arch }}
          path: dist/visr-v*-windows-${{ matrix.arch }}.exe

  macos:
    name: macos app bundle
    needs: build
    if: ${{ !cancelled() }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # The bundle script asks cargo for the version, so the pinned toolchain has to be there.
      - run: rustup toolchain install
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-apple-darwin"
          path: darwin
      # One binary that runs on Apple Silicon and Intel Macs.
      - run: |
          lipo -create -output visr-universal \
            darwin/aarch64-apple-darwin/visr \
            darwin/x86_64-apple-darwin/visr
          lipo -info visr-universal
          lipo visr-universal -verify_arch arm64 x86_64
      - run: |
          # A dry run has no tag, so it takes the version from the workspace.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            pkgid="$(cargo pkgid -p visr)"
            version="${pkgid##*[#@]}"
          fi
          ./scripts/bundle-macos.sh "$version" "$PWD/visr-universal"
          codesign --verify --strict --verbose=2 target/release/Visr.app
          dmg="visr-v$version-macos-universal.dmg"
          ./scripts/dmg-macos.sh "$dmg"
          # Open the image to check what a person will find in it, without launching the app.
          mkdir mnt
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/mnt" "$dmg"
          test -f mnt/Visr.app/Contents/MacOS/visr
          test -f mnt/Visr.app/Contents/Resources/licenses/LICENSE
          hdiutil detach "$PWD/mnt"
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: macos-dmg
          path: visr-v*-macos-universal.dmg

  publish:
    needs: [build, macos]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # Everything is published or nothing is: a failed target stops the release.
      - run: |
          mkdir dist
          # Windows names its architectures x64 and arm64.
          for build in x86_64-pc-windows-msvc:x64:'x86-64|x86_64|amd64' aarch64-pc-windows-msvc:arm64:'aarch64|arm64'; do
            IFS=: read -r target arch machine <<< "$build"
            exe="artifacts/$target/visr.exe"
            # Checked by reading the header only: the executables are never run.
            info="$(file -b "$exe")"
            grep -q 'PE32+' <<< "$info" && grep -q '(GUI)' <<< "$info" && grep -qiE "$machine" <<< "$info" \
              || { echo "$exe is not a $arch GUI executable: $info" >&2; exit 1; }
          done
          cp artifacts/windows-setup-*/*.exe dist/
          cp artifacts/macos-dmg/*.dmg dist/
          # A bare executable can't carry licenses, so they ship as one zip next to it.
          ./scripts/licenses.sh target
          zip="dist/visr-$GITHUB_REF_NAME-licenses.zip"
          (cd target && zip -r "../$zip" licenses)
          listing="$(unzip -l "$zip")"
          for entry in LICENSE fonts/LICENSE.txt fonts/LICENSE-nerd-fonts.txt fonts/NOTICE.txt \
            icons-editors/LICENSE.txt icons-symbols/LICENSE.txt; do
            grep -q " licenses/$entry\$" <<< "$listing" \
              || { echo "$zip has no licenses/$entry" >&2; exit 1; }
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # The notes are this version's section of CHANGELOG.md, up to the next heading or the links.
      - run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            /^\[[^]]+\]: / { found = 0 }
            /^## / { found = (index($0, heading) == 1) ; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
