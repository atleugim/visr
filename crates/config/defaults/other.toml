# ctrl alone belongs to the program in the terminal, so shortcuts add shift.

[keys]
new_tab = "ctrl-shift-t"
split_right = "ctrl-shift-d"
split_down = "ctrl-shift-e"
close_pane = "ctrl-shift-w"
close_tab = "ctrl-shift-x"
focus_next = "ctrl-shift-]"
focus_prev = "ctrl-shift-["
move_tab_up = "ctrl-shift-up"
move_tab_down = "ctrl-shift-down"
toggle_sidebar = "ctrl-shift-b"
zoom_pane = "ctrl-shift-enter"
copy = "ctrl-shift-c"
paste = "ctrl-shift-v"
reload_theme = "ctrl-shift-r"
quit = "ctrl-shift-q"
select_tab_1 = "ctrl-shift-1"
select_tab_2 = "ctrl-shift-2"
select_tab_3 = "ctrl-shift-3"
select_tab_4 = "ctrl-shift-4"
select_tab_5 = "ctrl-shift-5"
select_tab_6 = "ctrl-shift-6"
select_tab_7 = "ctrl-shift-7"
select_tab_8 = "ctrl-shift-8"
select_tab_9 = "ctrl-shift-9"
