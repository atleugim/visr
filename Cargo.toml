[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
app-state = { path = "crates/app-state" }
config = { path = "crates/config" }
gpui = "0.2.2"
hc-client = { path = "crates/hc-client" }
hc-proto = { path = "crates/hc-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
alacritty_terminal = "0.26"
term = { path = "crates/term" }
theme = { path = "crates/theme" }
ui = { path = "crates/ui" }
toml = "1.2.1"
notify = "8.2.2"

[profile.release]
strip = "symbols"
