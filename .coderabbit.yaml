# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  path_filters:
    - "!Cargo.lock"
    # Generated by scripts/build-icons.mjs and never edited by hand.
    - "!crates/ui/src/file_icons/table.rs"
    - "!crates/ui/assets/icons/symbols/**"
  auto_review:
    enabled: true
    drafts: false
    # Release PRs go from dev into main. dev is the default branch and is reviewed already.
    base_branches:
      - "^main$"
